[package]
name = "sashite-sanki-session"
version = "0.14.1"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Session kernel for the Sanki game suite over an abstract event model — the verdict a session's public events yield, built for Sashité."
repository = "https://github.com/sashite/sanki-session.rs"
homepage = "https://sashite.com/"
readme = "README.md"
keywords = ["chess", "ogi", "xiongqi", "board-game", "session"]
categories = ["games", "game-development"]

[dependencies]
sashite-sanki-engine = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
